[tool.poetry]
name = "smart_match_bot"
version = "0.1.0"
description = "Smart Styling Assistant"
authors = ["Evgenii Iurin"]
readme = "README.md"
package-mode = true
packages = [
    {include = "services", from = "src"}
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
loguru = ">=0.7.3,<0.8.0"
python-dotenv = ">=1.1.1,<2.0.0"
pre-commit = ">=4.3.0,<5.0.0"
fastapi = ">=0.116.1,<0.117.0"
httpx = ">=0.27.0,<0.28.0"
uvicorn = { version = ">=0.35.0,<0.36.0", extras = ["standard"] }
asyncpg = ">=0.29.0,<0.30.0"
pydantic-settings = ">=2.10.1,<3.0.0"
ruff = ">=0.13.0,<0.14.0"
rich = ">=14.1.0,<15.0.0"
ipywidgets = { version = "^8.1.7", optional = true }
langchain-openai = { version = "^1.1.0", optional = true }
langchain-core = { version = "^1.1.0", optional = true }


[tool.poetry.extras]
langchain = ["langchain-openai", "langchain-core"]


[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "C90",
    "I",
    "N",
    "UP",
    "YTT",
    "S",
    "BLE",
    "FBT",
    "B",
    "A",
    "C4",
    "DTZ",
    "T10",
    "EM",
    "EXE",
    "FA",
    "ISC",
    "ICN",
    "G",
    "INP",
    "PIE",
    "T20",
    "PYI",
    "PT",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SLOT",
    "SIM",
    "TID",
    "TCH",
    "INT",
    "ARG",
    "PTH",
    "TD",
    "FIX",
    "ERA",
    "PD",
    "PGH",
    "PL",
    "TRY",
    "FLY",
    "NPY",
    "AIR",
    "PERF",
    "FURB",
    "LOG",
    "RUF",
]
ignore = [
    "S101",
    "T201",
    "PLR0913",
    "PLR0912",
    "PLR0915",
    "COM812",
    "ISC001",
    "BLE001",
    "B008",
    "TRY003",
    "TRY301",
    "EM101",
    "EM102",
    "B904",
    "TRY400",
    "G004",
    "N803",
    "N815",
    "ARG001",
    "PTH123",
    "PD901",
    "INP001",
    "W291",
    "DTZ005",
    "PLE1142",
    "PERF401",
    "TRY300",
]

[tool.ruff.lint.isort]
force-single-line = false
known-first-party = ["smart_assistant"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
