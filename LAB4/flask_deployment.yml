apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask
  labels:
    app: lab4
    component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab4
      component: app
  template:
    metadata:
      labels:
        app: lab4
        component: app
    spec:
      initContainers:
      - name: init-db
        image: postgres:16
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Waiting for database to be ready..."
          until PGPASSWORD=$POSTGRES_PASSWORD pg_isready -h postgres-service -p 5432 -U $POSTGRES_USER -d $POSTGRES_DB; do
            echo "Database is unavailable - sleeping"
            sleep 2
          done
          echo "Database is ready - initializing schema..."
          PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres-service -U $POSTGRES_USER -d $POSTGRES_DB -c 'CREATE TABLE IF NOT EXISTS test_init (id SERIAL PRIMARY KEY);'
          echo "Database initialization completed!"
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB
      containers:
      - name: flask
        image: my_flask_image:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8000"
        - name: DB_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-service:5432/$(POSTGRES_DB)"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3